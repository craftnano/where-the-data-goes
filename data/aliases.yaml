# Hand-maintained alias table. Keys are canonical names; values are the raw
# strings observed on sub-processor lists that should resolve to the key.
# Order under each key is alphabetical for stable diffs.
#
# Rules of thumb for canonicalization:
#   * Collapse legal-entity suffixes (Inc., LLC, GmbH, Ltd, SARL, Limited, Corp.).
#   * Collapse jurisdictional variants ("Amazon Web Services, Inc.",
#     "AWS EMEA SARL" -> "Amazon Web Services"). We explicitly discard
#     jurisdiction here; see methodology note.
#   * The three cloud canonicals are Amazon Web Services, Google Cloud, and
#     Microsoft Azure. Each absorbs its parent brand (Amazon, Alphabet/Google,
#     Microsoft) because on sub-processor lists those parent names almost
#     always mean the cloud line. Azure OpenAI, Google Vertex AI, and Amazon
#     Bedrock stay as their own canonicals (distinct ingress points).
#   * Treat parent/child branded products as one node ONLY if a brand swap
#     wouldn't change the data flow (e.g. "Twilio SendGrid" -> "SendGrid"
#     stays separate because it's a distinct ingress point).

Amazon Web Services:
  - Amazon
  - Amazon Inc. (Connect)
  - Amazon Web Services
  - Amazon Web Services Inc.
  - Amazon Web Services, Inc.
  - Amazon Web Services EMEA SARL
  - Amazon Web Services EMEA S.a.r.l.
  - Amazon Data Services Ireland Limited
  - Amazon Data Services Ireland Ltd
  - Amazon.com
  - Amazon.com, Inc.
  - AWS
  # Note: "Amazon" and "Amazon Inc. (Connect)" are conditionally skipped by
  # entities.canonicalize when the purpose text is clearly retail/marketplace.

